
services:
  product-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-app
    image: linktic-product-app:1.0.0
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle-db2:1521/ORCLPDB1
      SPRING_DATASOURCE_USERNAME: SYSTEM
      SPRING_DATASOURCE_PASSWORD: oracle
    depends_on:
      - oracle-db2
    networks:
      - backend-net

  oracle-db2:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db2
    environment:
      ORACLE_PASSWORD: oracle
      ORACLE_DATABASE: ORCLPDB1
    ports:
      - "1523:1523"
    networks:
      - backend-net

networks:
  backend-net:
    external: true
    name: backend-net
